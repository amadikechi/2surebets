{% extends 'base.html' %}

{% block title %}Check your email — {{ site_name }}{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="auth-card" style="text-align:center;">
            <div style="font-size:2.4rem; margin-bottom:14px;">✉️</div>
            <h1 class="auth-title">Check your <span class="gold-text">email</span></h1>
            <p class="auth-sub">We've sent you a link to confirm your email address.</p>
            <div style="padding:20px; background:rgba(212,175,55,0.05); border:1px solid var(--border-gold); border-radius:var(--radius-md); font-size:0.88rem; color:var(--silver-300); line-height:1.7; margin-top:20px;">
                The link expires in <strong>3 days</strong>.<br>
                Didn't get it? Check your spam folder.
            </div>
        </div>
    </div>
</section>
{% endblock %}
