{% extends 'base.html' %}

{% block title %}Reset password — {{ site_name }}{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="kicker">Account recovery</span>
                <h1 class="auth-title">Reset your <span class="gold-text">password</span></h1>
                <p class="auth-sub">Enter your email and we'll send you a link to choose a new password.</p>
            </div>

            <form method="post" class="auth-form" novalidate>
                {% csrf_token %}
                <div class="form-field">
                    <label for="{{ form.email.id_for_label }}">Email address</label>
                    <input type="email" name="email" id="{{ form.email.id_for_label }}"
                           class="form-input" placeholder="you@example.com"
                           autocomplete="email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg auth-submit">Send reset link →</button>
                <p class="auth-alt">Remembered it? <a href="{% url 'accounts:login' %}">Sign in</a></p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
